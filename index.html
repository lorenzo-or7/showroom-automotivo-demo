<!doctype html>
<html lang="pt-BR" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Ferrum — Showroom automotivo demonstrativo</title>
    <meta
      name="description"
      content="Protótipo demonstrativo de showroom automotivo digital. Marca fictícia, veículos de exemplo e valores ilustrativos."
    />
    <meta name="robots" content="noindex" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#101214" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />

    <!-- Aplica o tema antes da primeira pintura para evitar flicker -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('ferrum:theme');
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark';
          document.documentElement.dataset.theme = theme;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', theme === 'light' ? '#F5F5F2' : '#101214');
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700&display=swap"
    />
    <!-- Imagem principal da hero: carregada com prioridade -->
    <link
      rel="preload"
      as="image"
      href="https://images.unsplash.com/photo-1617814065893-00757125efab?auto=format&fit=crop&w=1600&q=70"
      imagesrcset="https://images.unsplash.com/photo-1617814065893-00757125efab?auto=format&fit=crop&w=828&q=70 828w, https://images.unsplash.com/photo-1617814065893-00757125efab?auto=format&fit=crop&w=1280&q=70 1280w, https://images.unsplash.com/photo-1617814065893-00757125efab?auto=format&fit=crop&w=1920&q=70 1920w, https://images.unsplash.com/photo-1617814065893-00757125efab?auto=format&fit=crop&w=2560&q=70 2560w"
      imagesizes="100vw"
      fetchpriority="high"
    />
  </head>
  <body>
    <noscript>
      <p style="padding:24px;font-family:system-ui,sans-serif">
        Este protótipo precisa de JavaScript habilitado para exibir o catálogo e os formulários.

    <div id="root"></div>

</html>
